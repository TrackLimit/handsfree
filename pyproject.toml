[project]
name = "handsfree"
version = "0.1.0"
description = "Push-to-talk local speech-to-text that types at your cursor — dictate into any terminal app."
requires-python = ">=3.12,<3.13"
dependencies = [
    "mlx-whisper>=0.4",
    "sounddevice>=0.5",
    "numpy>=2.0",
    "pynput>=1.7",
    "rumps>=0.4",
]

[project.scripts]
handsfree = "handsfree.app:main"

[dependency-groups]
dev = ["py2app>=0.28"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["handsfree"]
